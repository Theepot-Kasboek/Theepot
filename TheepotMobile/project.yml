name: TheepotMobile
options:
  bundleIdPrefix: nl.bsodetheepot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.24.0

targets:
  TheepotMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TheepotMobile
    info:
      path: TheepotMobile/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Theepot
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSCameraUsageDescription: Theepot gebruikt de camera om bonnetjes te scannen voor het kasboek.
        NSPhotoLibraryUsageDescription: Theepot gebruikt je foto's om bestanden te versturen in de chat.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.bsodetheepot.mobile.dev
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "2ZY9W886KN"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Supabase
        product: Supabase
